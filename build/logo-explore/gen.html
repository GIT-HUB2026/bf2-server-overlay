<!doctype html>
<html><head><meta charset="utf-8"><title>RMO logo concepts</title>
<style>
body{background:#0b0f14;color:#b0ffc8;font:12px "Segoe UI";margin:16px}
.grid{display:grid;grid-template-columns:repeat(5,200px);gap:14px}
.tile{text-align:center}
.tile canvas{background:#10161e;border-radius:12px}
.tile .n{margin-top:4px;letter-spacing:1px}
h1{color:#3dff6e;font-size:15px;letter-spacing:2px}
</style></head><body>
<h1>RMO · RIBBY MAP OVERLAY — dot concepts</h1>
<div id="root" class="grid"></div>
<script>
const GREEN = '#3dff6e';
const off = document.createElement('canvas'); off.width = 300; off.height = 300;
const octx = off.getContext('2d', { willReadFrequently: true });

function ring(a, cx, cy, R, n, r, a0, a1) {
  a0 = a0 === undefined ? 0 : a0; a1 = a1 === undefined ? Math.PI * 2 : a1;
  for (let i = 0; i < n; i++) { const t = a0 + (a1 - a0) * i / n;
    a.push([cx + R * Math.cos(t), cy + R * Math.sin(t), r]); }
}
function arc(a, cx, cy, R, d0, d1, n, r) {
  for (let i = 0; i <= n; i++) { const t = (d0 + (d1 - d0) * i / n) * Math.PI / 180;
    a.push([cx + R * Math.cos(t), cy + R * Math.sin(t), r]); }
}
function line(a, x1, y1, x2, y2, n, r1, r2) {
  for (let i = 0; i < n; i++) { const t = n === 1 ? 0 : i / (n - 1);
    a.push([x1 + (x2 - x1) * t, y1 + (y2 - y1) * t, r1 + (r2 - r1) * t]); }
}
function sampleInto(a, drawFn, step, r) {
  octx.clearRect(0, 0, 300, 300); octx.fillStyle = '#fff'; drawFn(octx);
  const img = octx.getImageData(0, 0, 300, 300).data; const s3 = step * 3;
  for (let y = s3 / 2; y < 300; y += s3) for (let x = s3 / 2; x < 300; x += s3) {
    if (img[((y | 0) * 300 + (x | 0)) * 4 + 3] > 128) a.push([x / 3, y / 3, r]);
  }
}
function text(a, str, cx, cy, fs, step, r) {
  sampleInto(a, c => { c.font = '900 ' + fs * 3 + 'px "Segoe UI Black","Segoe UI","Arial Black",sans-serif';
    c.textAlign = 'center'; c.textBaseline = 'middle'; c.fillText(str, cx * 3, cy * 3); }, step, r);
}
function poly(a, pts, step, r) {
  sampleInto(a, c => { c.beginPath();
    pts.forEach((p, i) => i ? c.lineTo(p[0] * 3, p[1] * 3) : c.moveTo(p[0] * 3, p[1] * 3));
    c.closePath(); c.fill(); }, step, r);
}

const CONCEPTS = [
  ['RADAR SWEEP', a => {
    ring(a, 50, 50, 44, 40, 2.2); ring(a, 50, 50, 30, 28, 1.8); ring(a, 50, 50, 16, 16, 1.5);
    a.push([50, 50, 3.2]);
    const d = -50 * Math.PI / 180;
    line(a, 50 + 6 * Math.cos(d), 50 + 6 * Math.sin(d), 50 + 44 * Math.cos(d), 50 + 44 * Math.sin(d), 8, 1.4, 2.2);
    const d2 = -64 * Math.PI / 180;
    line(a, 50 + 10 * Math.cos(d2), 50 + 10 * Math.sin(d2), 50 + 42 * Math.cos(d2), 50 + 42 * Math.sin(d2), 6, 0.9, 1.3);
    a.push([66, 34, 2.6]); a.push([38, 63, 2.2]);
  }],
  ['RETICLE', a => {
    ring(a, 50, 50, 40, 36, 2);
    line(a, 50, 2, 50, 20, 4, 2.2, 1.6); line(a, 50, 98, 50, 80, 4, 2.2, 1.6);
    line(a, 2, 50, 20, 50, 4, 2.2, 1.6); line(a, 98, 50, 80, 50, 4, 2.2, 1.6);
    ring(a, 50, 50, 12, 12, 1.5); a.push([50, 50, 3.4]);
  }],
  ['MAP PIN', a => {
    ring(a, 50, 38, 25, 26, 2.2); ring(a, 50, 38, 12, 13, 1.6); a.push([50, 38, 3]);
    line(a, 33, 57, 47, 85, 5, 2, 1.2); line(a, 67, 57, 53, 85, 5, 2, 1.2); a.push([50, 90, 2.4]);
  }],
  ['DELTA JET', a => {
    ring(a, 50, 50, 47, 36, 1.1);
    poly(a, [[50, 4], [55, 30], [86, 58], [86, 64], [58, 56], [58, 74], [70, 84], [70, 89], [50, 80],
             [30, 89], [30, 84], [42, 74], [42, 56], [14, 64], [14, 58], [45, 30]], 5, 1.9);
  }],
  ['RMO MONOGRAM', a => {
    ring(a, 50, 50, 47, 44, 1.5); text(a, 'RMO', 50, 52, 30, 3.2, 1.5);
  }],
  ['COMPASS ROSE', a => {
    ring(a, 50, 50, 46, 40, 1.3);
    line(a, 50, 6, 58, 42, 6, 2, 1.3); line(a, 50, 6, 42, 42, 6, 2, 1.3);
    line(a, 50, 94, 58, 58, 6, 2, 1.3); line(a, 50, 94, 42, 58, 6, 2, 1.3);
    line(a, 94, 50, 58, 42, 6, 2, 1.3); line(a, 94, 50, 58, 58, 6, 2, 1.3);
    line(a, 6, 50, 42, 42, 6, 2, 1.3); line(a, 6, 50, 42, 58, 6, 2, 1.3);
    [45, 135, 225, 315].forEach(deg => { const t = deg * Math.PI / 180;
      a.push([50 + 24 * Math.cos(t), 50 + 24 * Math.sin(t), 1.8]); });
    ring(a, 50, 50, 8, 10, 1.2); a.push([50, 50, 2.6]);
  }],
  ['SONAR ARCS', a => {
    a.push([16, 84, 3]);
    arc(a, 16, 84, 18, -78, -12, 6, 1.7); arc(a, 16, 84, 32, -78, -12, 9, 1.8);
    arc(a, 16, 84, 46, -78, -12, 12, 1.9); arc(a, 16, 84, 60, -78, -12, 15, 2);
    const t = -40 * Math.PI / 180, bx = 16 + 52 * Math.cos(t), by = 84 + 52 * Math.sin(t);
    a.push([bx, by, 3]); ring(a, bx, by, 6.5, 10, 1.1);
  }],
  ['GLOBE GRID', a => {
    ring(a, 50, 50, 44, 40, 1.8);
    for (let i = 0; i < 26; i++) { const t = Math.PI * 2 * i / 26;
      a.push([50 + 44 * Math.cos(t), 50 + 15 * Math.sin(t), 1.3]);
      a.push([50 + 15 * Math.cos(t), 50 + 44 * Math.sin(t), 1.3]); }
    a.push([64, 30, 2.6]); ring(a, 64, 30, 5.5, 8, 0.9);
  }],
  ['HEX RADAR', a => {
    const v = []; for (let i = 0; i < 6; i++) { const t = (30 + 60 * i) * Math.PI / 180;
      v.push([50 + 45 * Math.cos(t), 50 + 45 * Math.sin(t)]); }
    for (let i = 0; i < 6; i++) { const p = v[i], q = v[(i + 1) % 6];
      a.push([p[0], p[1], 2.5]); line(a, p[0], p[1], q[0], q[1], 7, 1.8, 1.8); }
    ring(a, 50, 50, 20, 20, 1.6); a.push([50, 50, 3]);
  }],
  ['R RADAR PIN', a => {
    ring(a, 50, 50, 46, 42, 1.5); text(a, 'R', 50, 49, 60, 3.05, 1.3); a.push([75, 23, 2.2]);
  }],
];

function renderDots(canvas, dots, size, transparent) {
  canvas.width = size; canvas.height = size;
  const ctx = canvas.getContext('2d');
  if (!transparent) { ctx.fillStyle = '#10161e'; ctx.fillRect(0, 0, size, size); }
  const u = size / 100;
  ctx.fillStyle = GREEN; ctx.shadowColor = GREEN;
  ctx.globalAlpha = 0.4; ctx.shadowBlur = 2.2 * u;
  for (const d of dots) { ctx.beginPath(); ctx.arc(d[0] * u, d[1] * u, d[2] * u, 0, 7); ctx.fill(); }
  ctx.globalAlpha = 1; ctx.shadowBlur = 0.8 * u;
  for (const d of dots) { ctx.beginPath(); ctx.arc(d[0] * u, d[1] * u, d[2] * u, 0, 7); ctx.fill(); }
}
function build(i) { const a = []; CONCEPTS[i][1](a); return a; }

const q = new URLSearchParams(location.search);
if (q.get('c')) {
  document.body.style.background = 'transparent'; document.body.style.margin = '0';
  document.querySelector('h1').remove(); document.getElementById('root').remove();
  const size = parseInt(q.get('size') || '1024', 10);
  const cv = document.createElement('canvas'); cv.style.display = 'block';
  document.body.appendChild(cv);
  renderDots(cv, build(parseInt(q.get('c'), 10) - 1), size, true);
  document.title = 'done';
} else {
  const root = document.getElementById('root');
  CONCEPTS.forEach((c, i) => {
    const t = document.createElement('div'); t.className = 'tile';
    const cv = document.createElement('canvas'); t.appendChild(cv);
    const n = document.createElement('div'); n.className = 'n';
    n.textContent = (i + 1) + ' · ' + c[0]; t.appendChild(n);
    root.appendChild(t); renderDots(cv, build(i), 200, false);
  });
  document.title = 'done';
}
</script></body></html>
